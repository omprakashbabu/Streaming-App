<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - StreamVault</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-pattern"></div>
    
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo" onclick="window.location.href='home.html'">STREAMVAULT</div>
                <div class="nav-links">
                    <a href="home.html">Home</a>
                    <a href="admin.html">Admin Panel</a>
                    <span class="user-info">
                        <span id="user-name"></span>
                    </span>
                    <button onclick="handleLogout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <div class="admin-header">
            <h1 class="admin-title">VIDEO MANAGEMENT</h1>
            <button class="btn btn-primary" onclick="openAddModal()">+ Add New Video</button>
        </div>
        
        <div id="alert-container"></div>
        
        <div class="admin-table">
            <table>
                <thead>
                    <tr>
                        <th>Thumbnail</th>
                        <th>Title</th>
                        <th>Genre</th>
                        <th>Duration</th>
                        <th>Views</th>
                        <th>Upload Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="videos-table-body">
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 30px;">
                            <div class="spinner"></div>
                            <p>Loading videos...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Add/Edit Video Modal -->
    <div id="video-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Add New Video</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            
            <form id="video-form">
                <input type="hidden" id="video-id">
                
                <div class="form-group">
                    <label for="title">Video Title</label>
                    <input type="text" id="title" required placeholder="Enter video title">
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" required placeholder="Enter video description"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="thumbnail">Thumbnail URL</label>
                    <input type="url" id="thumbnail" required placeholder="https://example.com/thumbnail.jpg">
                </div>
                
                <div class="form-group">
                    <label for="s3Key">S3 Key (File path in bucket)</label>
                    <input type="text" id="s3Key" required placeholder="e.g., gaming/video1.mp4">
                    <small style="color: var(--text-gray); display: block; margin-top: 5px;">
                        Format: genre/filename.mp4
                    </small>
                </div>
                
                <div class="form-group">
                    <label for="duration">Duration</label>
                    <input type="text" id="duration" required placeholder="e.g., 12:45">
                </div>
                
                <div class="form-group">
                    <label for="genre">Genre</label>
                    <select id="genre" required>
                        <option value="">Select Genre</option>
                        <option value="Gaming">Gaming</option>
                        <option value="Album Songs">Album Songs</option>
                        <option value="Movie Scenes">Movie Scenes</option>
                        <option value="Racing">Racing</option>
                        <option value="Cartoons">Cartoons</option>
                        <option value="News">News</option>
                        <option value="Sports">Sports</option>
                        <option value="Documentary">Documentary</option>
                        <option value="Comedy">Comedy</option>
                        <option value="Technology">Technology</option>
                        <option value="Education">Education</option>
                        <option value="Travel">Travel</option>
                    </select>
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save Video</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()" style="flex: 1;">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script>
        // Check if user is admin
        checkAuth();
        const user = getUser();
        
        if (!user) {
            console.error('No user data found');
            alert('Session expired. Please login again.');
            window.location.href = 'index.html';
        } else if (!user.isAdmin) {
            alert('Access denied. Admin privileges required.');
            window.location.href = 'home.html';
        } else {
            document.getElementById('user-name').textContent = user.name;
        }
        
        let editingVideoId = null;
        
        // Load all videos
        async function loadVideos() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('http://localhost:5000/api/admin/videos', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) throw new Error('Failed to fetch videos');
                
                const videos = await response.json();
                displayVideos(videos);
            } catch (error) {
                console.error('Error loading videos:', error);
                showAlert('Failed to load videos', 'error');
            }
        }
        
        // Display videos in table
        function displayVideos(videos) {
            const tbody = document.getElementById('videos-table-body');
            
            if (videos.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 30px;">
                            <p style="color: var(--text-gray);">No videos found. Add your first video!</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = videos.map(video => `
                <tr>
                    <td>
                        <img src="${video.thumbnail}" alt="${video.title}" 
                             style="width: 80px; height: 45px; object-fit: cover; border-radius: 4px;"
                             onerror="this.src='https://via.placeholder.com/80x45/1B3C53/D2C1B6?text=No+Image'">
                    </td>
                    <td style="max-width: 250px;">${video.title}</td>
                    <td><span class="genre-badge">${video.genre}</span></td>
                    <td>${video.duration}</td>
                    <td>${video.views.toLocaleString()}</td>
                    <td>${new Date(video.uploadDate).toLocaleDateString()}</td>
                    <td>
                        <div class="admin-actions">
                            <button class="btn btn-secondary btn-sm" onclick="editVideo('${video._id}')">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteVideo('${video._id}')">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }
        
        // Open add modal
        function openAddModal() {
            editingVideoId = null;
            document.getElementById('modal-title').textContent = 'Add New Video';
            document.getElementById('video-form').reset();
            document.getElementById('video-id').value = '';
            document.getElementById('video-modal').classList.add('active');
        }
        
        // Edit video
        async function editVideo(id) {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`http://localhost:5000/api/videos/${id}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) throw new Error('Failed to fetch video');
                
                const video = await response.json();
                
                editingVideoId = id;
                document.getElementById('modal-title').textContent = 'Edit Video';
                document.getElementById('video-id').value = id;
                document.getElementById('title').value = video.title;
                document.getElementById('description').value = video.description;
                document.getElementById('thumbnail').value = video.thumbnail;
                document.getElementById('s3Key').value = video.s3Key;
                document.getElementById('duration').value = video.duration;
                document.getElementById('genre').value = video.genre;
                
                document.getElementById('video-modal').classList.add('active');
            } catch (error) {
                console.error('Error fetching video:', error);
                showAlert('Failed to load video details', 'error');
            }
        }
        
        // Delete video
        async function deleteVideo(id) {
            if (!confirm('Are you sure you want to delete this video?')) return;
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`http://localhost:5000/api/admin/videos/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) throw new Error('Failed to delete video');
                
                showAlert('Video deleted successfully', 'success');
                loadVideos();
            } catch (error) {
                console.error('Error deleting video:', error);
                showAlert('Failed to delete video', 'error');
            }
        }
        
        // Close modal
        function closeModal() {
            document.getElementById('video-modal').classList.remove('active');
        }
        
        // Handle form submission
        document.getElementById('video-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const videoData = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                thumbnail: document.getElementById('thumbnail').value,
                s3Key: document.getElementById('s3Key').value,
                duration: document.getElementById('duration').value,
                genre: document.getElementById('genre').value
            };
            
            try {
                const token = localStorage.getItem('token');
                const url = editingVideoId 
                    ? `http://localhost:5000/api/admin/videos/${editingVideoId}`
                    : 'http://localhost:5000/api/admin/videos';
                
                const method = editingVideoId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(videoData)
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to save video');
                }
                
                showAlert(editingVideoId ? 'Video updated successfully' : 'Video added successfully', 'success');
                closeModal();
                loadVideos();
            } catch (error) {
                console.error('Error saving video:', error);
                showAlert(error.message, 'error');
            }
        });
        
        // Load videos on page load
        loadVideos();
    </script>
</body>
</html>
